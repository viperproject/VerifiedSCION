name: Verify the router and its dependencies

# The verification options are not spelled out in this workflow anymore. Instead,
# every step points the Gobra Action at a JSON config with the `configFile` input,
# and Gobra reads all of its options from `gobra-mod.json` and `gobra.json`.
# Setting any other Gobra option next to `configFile` is reported as an error by
# Gobra, so the steps below only carry inputs that are not options of Gobra
# (`timeout`, `imageVersion`, and `statsFile`).
#
# `configFile` accepts either a `gobra.json` or a directory containing one, and is
# resolved against the directory in which the repository is checked out, so the
# steps below pass the path of the package to be verified as it appears in this
# repository:
#   - `gobra-mod.json` in the repository root holds the settings that are shared
#     by every verification job, i.e. what used to be the `env` block of this
#     workflow. `requireTriggers` remains disabled there, as it is unclear which
#     triggers to provide to monoset in a way that does not severely affect perf.
#   - A `gobra.json` next to a package holds only the settings in which that
#     package deviates from those module-wide defaults. Just three packages need
#     one, and the steps that rely on it say so:
#       * `verification/gobra.json`  -> recursive mode, excludes `layers`
#       * `router/gobra.json`        -> chopping, joins, permissions, MCE mode
#   - Every other step points at a directory that has NO `gobra.json`. That is not
#     an omission: Gobra then verifies the package in that directory with the
#     module-wide defaults unchanged, which is what those packages used to get
#     from the `env` block. Adding a `gobra.json` there is how a single package
#     would opt out of a default.
#
# Two things about paths in these configs are easy to get wrong:
#   - They are resolved against the directory of their config with 'Path.resolve',
#     which does NOT normalize: "." yields '<dir>/.' and ".." yields '<dir>/..'.
#     Use "" to refer to the directory of the config itself.
#   - Gobra matches the relative package path of a 'friendPkg' clause against the
#     package it verifies by string equality, and both sides are relative to the
#     project root. Setting 'project_root' for a package that is a friend of
#     another one ('pkg/slayers' and 'layers' are friends of 'gopacket') therefore
#     changes whether the friend permissions apply at all. Only the recursive job
#     sets it, which is what the workflow did before the move to JSON configs.
#
# These are the same configs that Gobra picks up locally, so a step below can be
# reproduced with `gobra --config <package>`, and the options that Gobra resolves
# for a package can be listed with `gobra --config <package> --printConfig`.
#
# The 'print-resolved-configs' job does exactly that for every package on every
# run, so that the settings a package ends up with are visible in the workflow log
# without having to merge '/gobra-mod.json' with a 'gobra.json' by hand. Note that
# '--printConfig' makes Gobra print its configuration and exit *without verifying*,
# which is why it is a job of its own and not an input of the steps that verify.

on:
  push:
    branches:
    - master
  pull_request: # run this workflow on every pull_request

env:
  imageVersion: 'latest'

jobs:
  # Prints the options that Gobra resolves from '/gobra-mod.json' and the
  # 'gobra.json' of each package. This job verifies nothing; it documents what the
  # verification jobs below run with, and it fails whenever a config stops
  # resolving (e.g. a bad option, a missing include dir, or a 'configFile' that no
  # longer points at a package).
  #
  # All packages are printed within a single job on purpose: every step of the
  # Gobra Action builds a container from the Gobra image, so keeping them together
  # reuses the image instead of pulling it once per package.
  print-resolved-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the VerifiedSCION repository
        uses: actions/checkout@v3
      - name: Print the configuration of 'verification' (recursive)
        uses: viperproject/gobra-action@main
        with:
          configFile: 'verification'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'verification/dependencies/github.com/google/gopacket/layers'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'verification/dependencies/github.com/google/gopacket/layers'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/addr'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/addr'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/experimental/epic'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/experimental/epic'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/log'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/log'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/private/serrors'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/private/serrors'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/scrypto'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/scrypto'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/slayers'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/slayers/path'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/slayers/path/empty'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/empty'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/slayers/path/epic'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/epic'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/slayers/path/onehop'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/onehop'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'pkg/slayers/path/scion'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/scion'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'private/topology'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/topology'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'private/topology/underlay'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/topology/underlay'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'private/underlay/conn'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/underlay/conn'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'private/underlay/sockctrl'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/underlay/sockctrl'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'router/bfd'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'router/bfd'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'router/control'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'router/control'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
      - name: Print the configuration of 'router/'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'router'
          printConfig: '1'
          timeout: 2m
          imageVersion: ${{ env.imageVersion }}
  verify-third-party-libs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the VerifiedSCION repository
        uses: actions/checkout@v3
      # 'verification/gobra.json' puts this step in recursive mode, so that all
      # nested packages below 'verification' are verified. It also sets the project
      # root and the include dirs relative to 'verification', because this step
      # does not verify the repository root.
      - name: Verify the packages in the 'verification' directory (recursive)
        uses: viperproject/gobra-action@main
        with:
          ## Due to a bug, we cannot use the recursive mode with friend pacakge invariants,
          ## which is why 'verification/gobra.json' excludes the 'layers' package via
          ## '--excludePackages'.
          configFile: 'verification'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      # due to the bug mention above, we need to verify this package separately.
      # It must use the include dirs of '/gobra-mod.json' unchanged: 'gopacket'
      # grants it access with a relative 'friendPkg "./layers"', which only matches
      # the package under verification if 'gopacket' is reached through a normalized
      # include dir. Include dirs relative to this package would contain '..'
      # segments, which Gobra does not normalize, and the friend clause stops
      # applying.
      - name: Verify package 'verification/dependencies/github.com/google/gopacket/layers'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'verification/dependencies/github.com/google/gopacket/layers'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
  verify-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the VerifiedSCION repository
        uses: actions/checkout@v3
      # Skip caching for now, the Github action right now is very limited.
      # On top of that, the 'caching' input of the Action is not available in
      # config file mode, as Gobra's JSON config has no field for '--cacheFile'
      # and that option cannot be passed next to '--config'. Setting it would
      # fail the step rather than be ignored.
      # - name: Cache the verification results
      #   uses: actions/cache@v3
      #   env:
      #     cache-name: gobra-cache
      #   with:
      #     path: ${{ runner.workspace }}/.gobra/cache.json
      #     key: ${{ env.cache-name }}

      # We split the verification of the entire repository into
      # multiple steps. This provides a more fine-grained log in
      # Github Workflow's interface and it allows more fine-grained
      # control over the settings applied to each package (which is
      # now expressed by the 'gobra.json' of the respective package).
      #
      # None of the packages below deviates from the module-wide defaults, so none
      # of them has a 'gobra.json'; they are all verified with the settings from
      # '/gobra-mod.json'.
      - name: Verify package 'pkg/addr'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/addr'
          timeout: 10m
          imageVersion: ${{ env.imageVersion }}
          statsFile: '/stats/stats_addr.json'
      - name: Verify package 'pkg/experimental/epic'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/experimental/epic'
          timeout: 7m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/log'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/log'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/private/serrors'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/private/serrors'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/scrypto'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/scrypto'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers'
          timeout: 25m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers/path'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path'
          timeout: 10m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers/path/empty'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/empty'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers/path/epic'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/epic'
          # timeout increased; we were having frequent timeouts before
          timeout: 10m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers/path/onehop'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/onehop'
          timeout: 10m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers/path/scion'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/scion'
          timeout: 30m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'private/topology'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/topology'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'private/topology/underlay'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/topology/underlay'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'private/underlay/conn'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/underlay/conn'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'private/underlay/sockctrl'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/underlay/sockctrl'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'router/bfd'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'router/bfd'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'router/control'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'router/control'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Upload the verification report
        uses: actions/upload-artifact@v4
        with:
          name: stats_addr.json
          path: /stats/stats_addr.json
          if-no-files-found: error # could also be 'warn' or 'ignore'
  verify-router:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the VerifiedSCION repository
        uses: actions/checkout@v3
      # 'router/gobra.json' raises the chopping bound and switches to the settings
      # that this package needs to verify in a reasonable time ('--moreJoins impure',
      # '--conditionalizePermissions' and '--mceMode on'). It applies to this package
      # only, not to 'router/bfd' and 'router/control', which are verified above with
      # the module-wide defaults.
      - name: Verify package 'router/'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'router'
          timeout: 6h
          imageVersion: ${{ env.imageVersion }}
  # TEMPORARY diagnostic job, to be removed before merge.
  #
  # 'pkg/slayers/path/scion' fails in config file mode with a proof failure
  # ("Assertion pktView.CurrSeg.AInfo == infoView.AInfo might not hold" in
  # raw_spec.gobra:716), even though every resolved option now matches what the
  # workflow passed before the move to JSON configs. This step verifies the same
  # package with the old style inputs on the same commit and the same Gobra image.
  # If it fails too, the proof does not hold with the current 'latest' image and
  # the failure is unrelated to the JSON configs; master last ran a month ago.
  zz-temp-diagnose-scion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the VerifiedSCION repository
        uses: actions/checkout@v3
      - name: Verify 'pkg/slayers/path/scion' with the old style inputs
        uses: viperproject/gobra-action@main
        with:
          packages: 'pkg/slayers/path/scion'
          timeout: 30m
          headerOnly: '1'
          module: 'github.com/scionproto/scion'
          includePaths: '. verification/dependencies'
          assumeInjectivityOnInhale: '1'
          checkConsistency: '1'
          parallelizeBranches: '0'
          imageVersion: 'latest'
          mceMode: 'od'
          requireTriggers: '0'
          overflow: '0'
          useZ3API: '0'
          disableNL: '0'
          viperBackend: 'SILICON'
          unsafeWildcardOptimization: '0'
          respectFunctionPrePermAmounts: '0'
          enableFriendClauses: '1'
