name: Verify the router and its dependencies

# Gobra reads all of its options from `gobra-mod.json` in the repository root and,
# where a package deviates from it, a `gobra.json` next to that package. A step
# points at a package with `configFile` (relative to the repository root) and may
# only carry inputs that are not Gobra options; anything else is an error.
# Reproduce a step locally with `gobra --config <package>`.
#
# Two gotchas: paths in a config are resolved with `Path.resolve`, which does not
# normalize, so use "" and not "." for the config's own directory; and `friendPkg`
# clauses are matched relative to the project root, so setting `project_root`
# withdraws the friend permissions `gopacket` grants `pkg/slayers` and `layers`.

on:
  push:
    branches:
    - master
  pull_request: # run this workflow on every pull_request

env:
  imageVersion: 'latest'

jobs:
  verify-third-party-libs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the VerifiedSCION repository
        uses: actions/checkout@v3
      - name: Verify the packages in the 'verification' directory (recursive)
        uses: viperproject/gobra-action@main
        with:
          ## Due to a bug, we cannot use the recursive mode with friend pacakge invariants,
          ## which is why 'verification/gobra.json' excludes the 'layers' package.
          configFile: 'verification'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      # due to the bug mention above, we need to verify this package separately
      - name: Verify package 'verification/dependencies/github.com/google/gopacket/layers'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'verification/dependencies/github.com/google/gopacket/layers'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
  verify-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the VerifiedSCION repository
        uses: actions/checkout@v3
      # Skip caching for now, the Github action right now is very limited.
      # 'caching' is also unavailable in config file mode and would fail the step.
      # - name: Cache the verification results
      #   uses: actions/cache@v3
      #   env:
      #     cache-name: gobra-cache
      #   with:
      #     path: ${{ runner.workspace }}/.gobra/cache.json
      #     key: ${{ env.cache-name }}

      # We split the verification of the entire repository into
      # multiple steps. This provides a more fine-grained log in
      # Github Workflow's interface and it allows more fine-grained
      # control over the settings applied to each package (which is
      # now expressed by the 'gobra.json' of the respective package).
      - name: Verify package 'pkg/addr'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/addr'
          timeout: 10m
          imageVersion: ${{ env.imageVersion }}
          statsFile: '/stats/stats_addr.json'
      - name: Verify package 'pkg/experimental/epic'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/experimental/epic'
          timeout: 7m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/log'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/log'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/private/serrors'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/private/serrors'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/scrypto'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/scrypto'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers'
          timeout: 25m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers/path'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path'
          timeout: 10m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers/path/empty'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/empty'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers/path/epic'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/epic'
          # timeout increased; we were having frequent timeouts before
          timeout: 10m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers/path/onehop'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/onehop'
          timeout: 10m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'pkg/slayers/path/scion'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'pkg/slayers/path/scion'
          timeout: 30m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'private/topology'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/topology'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'private/topology/underlay'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/topology/underlay'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'private/underlay/conn'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/underlay/conn'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'private/underlay/sockctrl'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'private/underlay/sockctrl'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'router/bfd'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'router/bfd'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Verify package 'router/control'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'router/control'
          timeout: 5m
          imageVersion: ${{ env.imageVersion }}
      - name: Upload the verification report
        uses: actions/upload-artifact@v4
        with:
          name: stats_addr.json
          path: /stats/stats_addr.json
          if-no-files-found: error # could also be 'warn' or 'ignore'
  verify-router:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the VerifiedSCION repository
        uses: actions/checkout@v3
      - name: Verify package 'router/'
        uses: viperproject/gobra-action@main
        with:
          configFile: 'router'
          timeout: 6h
          imageVersion: ${{ env.imageVersion }}
