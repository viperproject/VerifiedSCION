  <text x="700" y="722" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="12.5" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">DstIA == d.localIA  →  resolveInbound() → resolveLocalDst()</text>
