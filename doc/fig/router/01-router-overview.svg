<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Crossbar view of a SCION border router: external and internal interfaces feed a single per-packet pipeline, which routes inbound, outbound, BR transit and AS transit traffic.">
  <title>SCION border router at a glance</title>
  <desc>Crossbar view of a SCION border router: external and internal interfaces feed a single per-packet pipeline, which routes inbound, outbound, BR transit and AS transit traffic.</desc>
  <rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff"/>
  <text x="70" y="52" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#12203a" text-anchor="start" font-weight="700" xml:space="preserve">The SCION border router at a glance</text>
  <text x="70" y="80" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">One process per border router, one UDP/IP socket per interface. Every packet enters on one interface, is validated, and leaves on the interface named by its hop field.</text>
