<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Configuration flows from topology.json through control.IACtx.Configure into the DataPlane forwarding state; Run then spawns one read goroutine per interface plus the BFD sessions.">
  <title>Border router startup and goroutines</title>
  <desc>Configuration flows from topology.json through control.IACtx.Configure into the DataPlane forwarding state; Run then spawns one read goroutine per interface plus the BFD sessions.</desc>
  <rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff"/>
  <text x="70" y="52" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#12203a" text-anchor="start" font-weight="700" xml:space="preserve">Startup: configure the DataPlane, then Run() spawns one receive loop per interface</text>
  <text x="70" y="80" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">router/cmd/router/main.go  ·  router/control  ·  router/dataplane.go</text>
  <line x1="70" y1="96" x2="1530" y2="96" stroke="#d7dfea" stroke-width="1.4"/>
  <rect x="50" y="130" width="250" height="96" rx="10" fill="#f3f6fa" stroke="#c3cedd" stroke-width="1.6"/>
  <text x="63" y="154.8" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="14" fill="#12203a" text-anchor="start" font-weight="700" xml:space="preserve">main() → realMain(ctx)</text>
  <text x="63" y="173.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">router/cmd/router/main.go</text>
  <text x="63" y="190.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">an errgroup owns every</text>
  <text x="63" y="207" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">long-running task</text>
  <polyline points="300,178 329,178" fill="none" stroke="#8fa0b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="338,178 329,173.9 329,182.1" fill="#8fa0b8"/>
  <rect x="340" y="130" width="300" height="118" rx="10" fill="#f3f6fa" stroke="#c3cedd" stroke-width="1.6"/>
  <text x="353" y="154.3" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="13.5" fill="#12203a" text-anchor="start" font-weight="700" xml:space="preserve">control.LoadConfig(id, confDir)</text>
  <text x="353" y="173" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">topology.json → interfaces,</text>
  <text x="353" y="189.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">  neighbours, link types,</text>
  <text x="353" y="206.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">  sibling BRs, services</text>
  <text x="353" y="223.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">keys/master0.key → DeriveHFMacKey</text>
  <polyline points="640,178 669,178" fill="none" stroke="#8fa0b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="678,178 669,173.9 669,182.1" fill="#8fa0b8"/>
  <rect x="680" y="130" width="300" height="220" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="693" y="154.8" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="14" fill="#12203a" text-anchor="start" font-weight="700" xml:space="preserve">control.IACtx.Configure()</text>
  <text x="693" y="171.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#5b6b85" text-anchor="start" font-weight="400" xml:space="preserve">ConfigDataplane(dp, cfg) calls, in order:</text>
  <text x="693" y="190.4" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#12203a" text-anchor="start" font-weight="400" xml:space="preserve">SetIA(ia)</text>
  <text x="693" y="206.5" font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="11.5" fill="#12203a" text-anchor="start" font-weight="400" xml:space="preserve">SetKey(masterKey)</text>
